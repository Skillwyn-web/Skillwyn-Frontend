version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    volumes:
      - ./resume_mvp:/app/resume_mvp
    command: uvicorn resume_mvp.api.app:app --host 0.0.0.0 --port 8000 --reload
